<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 64" role="img" aria-label="Relay" shape-rendering="geometricPrecision">
  <title>Relay</title>
  <!-- Wordmark, light standalone asset. Ink only by rule: the wordmark never
       takes the cobalt action. Lettering is the app's sans at 700, untracked
       (Optimistic VF where it is installed, IBM Plex Sans otherwise). In-app
       chrome uses CSS tokens via RelayMark. -->
  <g fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 14 L28 32 L8 50" stroke="#0a1317"/>
    <path d="M28 14 L48 32 L28 50" stroke="#0a1317" opacity="0.45"/>
  </g>
  <text x="74" y="44"
        font-family="'Optimistic VF', 'IBM Plex Sans', Montserrat, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="42"
        font-weight="700"
        letter-spacing="0"
        fill="#0a1317">Relay</text>
</svg>
