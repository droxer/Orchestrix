    <path d="M8 14 L28 32 L8 50" stroke="#23251d"/>
    <path d="M28 14 L48 32 L28 50" stroke="#23251d" opacity="0.45"/>
  </g>
  <text x="74" y="44"
        font-family="'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="42"
        font-weight="700"
        letter-spacing="0"
        fill="#23251d">Relay</text>
</svg>
