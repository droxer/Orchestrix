<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Relay" shape-rendering="geometricPrecision">
  <title>Relay</title>
  <!-- Fieldnotes app icon (dark default): dark-olive canvas + action-yellow lead chevron.
       Yellow is the brand accent — the register-invariant --action — so the mark
       matches the product's primary CTA. At 16px the icon's job is to identify
       Relay, and an olive chevron on an olive square vanishes in a tab strip. -->
  <rect x="4" y="4" width="56" height="56" rx="15" fill="#1f211a"/>
  <g fill="none" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 20 L36 32 L22 44" stroke="#f7a501"/>
    <path d="M36 20 L50 32 L36 44" stroke="#f1f1e8" opacity="0.45"/>
  </g>
</svg>
