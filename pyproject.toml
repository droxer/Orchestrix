[project]
name = "orchestrix"
version = "0.1.0"
description = "Local-first multi-agent orchestration with BoxLite and LangGraph"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boxlite>=0.9.5",
    "langgraph>=1.2.1",
    "python-dotenv>=1.2.2",
    "rich>=14.0.0",
]

[project.scripts]
orchestrix = "orchestrix.orchestrator:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
