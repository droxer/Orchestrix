[project]
name = "relay"
version = "0.1.0"
description = "Relay backend control plane in Python"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128.0",
  "loguru>=0.7.0",
  "pydantic>=2.12.0",
  "psycopg>=3.2.0",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.38.0",
]

[project.optional-dependencies]
dev = [
  "alembic>=1.17.0",
  "httpx>=0.28.0",
  "pre-commit>=4.0.0",
  "pytest>=9.0.0",
]

[project.scripts]
relay = "relay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "postgres: requires a live Postgres database",
  "integration: starts backend, daemon, or client processes",
  "slow: longer-running filesystem or process tests",
]
